apiVersion: apps/v1
kind: Deployment
metadata:
  name: agi-platform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agi-platform-api
  template:
    metadata:
      labels:
        app: agi-platform-api
    spec:
      containers:
        - name: api
          image: agi-platform:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: agi-platform-api
spec:
  selector:
    app: agi-platform-api
  ports:
    - port: 80
      targetPort: 8000
